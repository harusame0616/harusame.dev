packages:
  - 'packages/*'

# 公開から 14 日 (20160 分) 経過していないバージョンはインストールしない
# (悪意あるパッケージがレジストリから取り下げられるまでの猶予)
minimumReleaseAge: 20160

# プラットフォーム別バイナリは親パッケージと同一バージョン・同時公開で exact pin されるため、
# 親パッケージ側の 14 日制限で担保されるものとして除外する
minimumReleaseAgeExclude:
  - '@rollup/rollup-*'
  - '@esbuild/*'
  - '@cloudflare/workerd-*'
  - '@img/sharp-*'
  - '@tailwindcss/oxide-*'
  - '@biomejs/cli-*'

# pnpm add 時に ^ や ~ を付けず exact version で package.json に記録する
savePrefix: ""

# 依存パッケージのビルドスクリプト (preinstall / postinstall 等) の実行を明示的に禁止する
# (サプライチェーン攻撃の主要経路の遮断。必要になったら onlyBuiltDependencies で個別許可する)
allowBuilds: false

# すべての依存のバージョンを catalog で一元管理する
# (pnpm add 時はカタログへ自動登録され、カタログ外バージョンの追加はエラーになる)
catalogMode: strict

