name: Renovate 設定検証

# マージの必須チェックにするため、paths でトリガー自体を絞る (起動しないと
# チェックが pass にならない) のではなく、全 PR で起動して paths-filter による
# ステップレベル制御を行う
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-config:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # 対象: renovate 設定本体、検証に使う renovate のバージョンに影響する root の
      #       設定ファイル、このワークフロー自身
      - name: 変更ファイルの検出
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            renovate-config:
              - ".github/renovate.json5"
              - ".github/workflows/renovate-config-check.yml"
              - "package.json"
              - "pnpm-workspace.yaml"
              - "pnpm-lock.yaml"
              - ".node-version"

      - name: pnpm のセットアップ
        if: ${{ steps.filter.outputs.renovate-config == 'true' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Node.js のセットアップ
        if: ${{ steps.filter.outputs.renovate-config == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: "./.node-version"
          cache: pnpm

      - name: パッケージインストール
        if: ${{ steps.filter.outputs.renovate-config == 'true' }}
        run: pnpm install

      - name: renovate の設定ファイルの検証
        if: ${{ steps.filter.outputs.renovate-config == 'true' }}
        run: pnpm exec renovate-config-validator .github/renovate.json5
